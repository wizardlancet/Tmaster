[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tmaster-server"
version = "0.0.1"
description = "TMaster server core (agent gateway + dashboard API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "aiosqlite>=0.20",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "websockets>=12.0",
    "tmaster-agent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
tmaster-agent = { path = "../agent", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
